name: Font Assets Check

on:
  pull_request:
    paths:
      - 'scripts/prepare-font.mjs'
      - 'resources/fonts/**'
      - 'resources/css/fontawesome/**'
      - '.github/workflows/font-assets-check.yml'
  workflow_dispatch:

jobs:
  font-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Light source chunks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';

          const dir = 'resources/fonts/fontawesome/fa-light-300.woff2.base64';
          const parts = (await readdir(dir)).filter((name) => /^part-.*\.txt$/.test(name)).sort();

          for (const name of parts) {
              const content = (await readFile(resolve(dir, name), 'utf8')).replace(/\s+/g, '');
              console.log(`${name}|${content.length}|${content.slice(0, 64)}|${content.slice(-64)}`);
          }
          NODE

      - name: Rebuild and validate font assets
        run: npm run prepare-font
