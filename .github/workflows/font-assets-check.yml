name: Font Assets Build Check

on:
  push:
    branches:
      - main
    paths:
      - 'resources/fonts/**'
      - 'resources/css/app.css'
      - 'resources/views/layouts/app.blade.php'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/font-assets-check.yml'
  pull_request:
    paths:
      - 'resources/fonts/**'
      - 'resources/css/app.css'
      - 'resources/views/layouts/app.blade.php'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/font-assets-check.yml'
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
