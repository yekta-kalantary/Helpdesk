name: Font Assets Check

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/prepare-font.mjs'
      - 'resources/fonts/**'
      - 'resources/css/fontawesome/**'
      - '.github/workflows/font-assets-check.yml'
  pull_request:
    paths:
      - 'scripts/prepare-font.mjs'
      - 'resources/fonts/**'
      - 'resources/css/fontawesome/**'
      - '.github/workflows/font-assets-check.yml'
  workflow_dispatch:

jobs:
  font-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild and validate font assets
        run: npm run prepare-font
