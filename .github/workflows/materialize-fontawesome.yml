name: Materialize Font Awesome binaries

on:
  push:
    branches:
      - agent/fontawesome-direct-files
    paths:
      - .font-transfer/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fontawesome-direct-files

      - name: Materialize original WOFF2 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources/fonts/fontawesome

          cat .font-transfer/brands/part-* | tr -d '\r\n ' | base64 --decode > resources/fonts/fontawesome/fa-brands-400.woff2
          cat .font-transfer/light/part-* | tr -d '\r\n ' | base64 --decode > resources/fonts/fontawesome/fa-light-300.woff2

          echo '57f8508ef396d096c48c6ad56257e0fcc510a5560bb220c13339be93543ff868  resources/fonts/fontawesome/fa-brands-400.woff2' | sha256sum --check
          echo '4bf8e8608d8ddb833c06b636235b13f3d6926de361fbf590f369405fb06c4707  resources/fonts/fontawesome/fa-light-300.woff2' | sha256sum --check

          rm -rf resources/fonts/fontawesome/fa-brands-400.woff2.base64
          rm -rf resources/fonts/fontawesome/fa-light-300.woff2.base64
          rm -rf .font-transfer

      - name: Validate prepare-font
        run: node scripts/prepare-font.mjs

      - name: Commit direct font assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add direct Font Awesome WOFF2 assets'
          git push origin HEAD:agent/fontawesome-direct-files
