name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: helpdesk_testing
          MARIADB_USER: helpdesk
          MARIADB_PASSWORD: helpdesk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpdesk_testing
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify database schema
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

      - name: Run tests
        run: php artisan test

      - name: Check PHP style
        run: ./vendor/bin/pint --test

      - name: Build deployable source archive
        run: |
          zip -qr helpdesk.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'vendor/*' \
            -x '.env' \
            -x 'storage/logs/*' \
            -x 'helpdesk.zip'

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk
          path: helpdesk.zip
          if-no-files-found: error
          retention-days: 30
