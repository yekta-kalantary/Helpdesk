name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run database migrations
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

      - name: Verify routes
        run: php artisan route:list

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Run tests
        run: php artisan test

      - name: Check PHP style
        run: |
          ./vendor/bin/pint database/migrations/2026_08_07_006000_move_profiles_to_people_table.php
          echo '---PINT_FORMATTED_FILE_BEGIN---'
          cat database/migrations/2026_08_07_006000_move_profiles_to_people_table.php
          echo '---PINT_FORMATTED_FILE_END---'
          git diff --exit-code -- database/migrations/2026_08_07_006000_move_profiles_to_people_table.php

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify IRANYekan font asset
        run: |
          test -f public/fonts/IRANYekanXVF.woff2
          test "$(wc -c < public/fonts/IRANYekanXVF.woff2 | tr -d ' ')" = "95404"
          echo "3a3a62a935a549584d610e38b4b27ea30053c6fe137ca0186687dec038cfcf88  public/fonts/IRANYekanXVF.woff2" | sha256sum -c -
          ! grep -R "Instrument Sans\|fonts.bunny.net\|/build/fonts/IRANYekanXVF" public/build resources/css vite.config.js

      - name: Build deployable source archive
        run: |
          rm -f database/database.sqlite
          zip -qr helpdesk.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'vendor/*' \
            -x '.env' \
            -x 'storage/logs/*' \
            -x 'helpdesk.zip'

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk
          path: helpdesk.zip
          if-no-files-found: error
          retention-days: 30
