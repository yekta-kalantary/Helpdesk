name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: helpdesk_testing
          MARIADB_USER: helpdesk
          MARIADB_PASSWORD: helpdesk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpdesk_testing
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify database schema
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

      - name: Verify routes
        run: php artisan route:list

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.txt

      - name: Upload test diagnostics
        if: always() && hashFiles('test-output.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 1

      - name: Check PHP style
        run: ./vendor/bin/pint --test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite font assets
        run: |
          IRANYEKAN_ASSET="$(find public/build/assets -maxdepth 1 -type f -name 'IRANYekanXVF-*.woff2' -print -quit)"
          FA_LIGHT_ASSET="$(find public/build/assets -maxdepth 1 -type f -name 'fa-light-300-*.woff2' -print -quit)"

          test -n "$IRANYEKAN_ASSET"
          test -n "$FA_LIGHT_ASSET"

          cmp resources/fonts/IRANYekanXVF/IRANYekanXVF.woff2 "$IRANYEKAN_ASSET"
          cmp resources/fonts/fontawesome/fa-light-300.woff2 "$FA_LIGHT_ASSET"

          grep -q '\.fa-house' resources/css/fontawesome.css
          ! grep -R "data:font/woff2;base64" public/build resources/css
          ! grep -R "fonts.bunny.net" public/build resources/css vite.config.js
          ! grep -R "../webfonts/" resources/css
          ! grep -R "../fonts/fontawesome/css/" resources/css/app.css
          ! grep -R "/fonts/IRANYekanXVF.woff2" resources/css resources/views/layouts/app.blade.php
          ! grep -R "asset('fontawesome/" resources/views/layouts/app.blade.php

      - name: Build deployable source archive
        run: |
          zip -qr helpdesk.zip . \
            -x '.git/*' \
            -x 'node_modules/*' \
            -x 'vendor/*' \
            -x '.env' \
            -x 'storage/logs/*' \
            -x 'helpdesk.zip'

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: helpdesk
          path: helpdesk.zip
          if-no-files-found: error
          retention-days: 30