name: Refresh Composer Lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/helpdesk-core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Refresh lock file
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Commit lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Refresh Composer lock"
          git push origin HEAD:agent/helpdesk-core
