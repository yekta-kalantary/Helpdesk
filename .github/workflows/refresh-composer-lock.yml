name: Refresh Composer lock

on:
  push:
    branches:
      - agent/contact-core-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/contact-core-cleanup

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Refresh lock file
        env:
          COMPOSER_MINIMAL_CHANGES: '1'
        run: composer update --no-install --no-interaction --no-progress --minimal-changes

      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Composer lock"
            git push origin HEAD:agent/contact-core-cleanup
          fi
