name: Refresh modular Composer lock

on:
  push:
    branches:
      - agent/modular-foundation-media
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/modular-foundation-media
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Refresh lock
        run: composer update --minimal-changes --no-interaction --prefer-dist --no-progress

      - name: Commit lock if changed
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Refresh Composer lock"
          git push origin HEAD:agent/modular-foundation-media
