name: Update Livewire Lock

on:
  push:
    branches:
      - agent/helpdesk-core
    paths:
      - composer.json
      - .github/workflows/update-livewire-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/helpdesk-core

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, exif, fileinfo
          coverage: none
          tools: composer:v2

      - name: Update Livewire lock entry
        run: composer update livewire/livewire --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Commit lock file
        run: |
          if git diff --quiet composer.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Lock Livewire 4 dependency"
          git push origin HEAD:agent/helpdesk-core
