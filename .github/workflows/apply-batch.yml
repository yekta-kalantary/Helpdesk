name: Apply Work Management Batch

on:
  push:
    branches:
      - wip/project-work-management-batch-20260816
    paths:
      - '.patch/**'
      - '.github/workflows/apply-batch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: wip/project-work-management-batch-20260816
          fetch-depth: 0

      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/p-aa.b64 .patch/p-ab.b64 .patch/p-ac.b64 .patch/p-ad.b64 .patch/p-ae.b64 .patch/p-af.b64 .patch/p-ag.b64 | base64 -d > /tmp/work-management.patch.gz
          echo '1ad6f59ff9ae90dab5ff0eb280171474f4c2ee313152cfa57dd4bf8cb3e7b891  /tmp/work-management.patch.gz' | sha256sum -c -
          gzip -dc /tmp/work-management.patch.gz > /tmp/work-management.patch
          patch -p1 --forward --batch < /tmp/work-management.patch
          rm -f app-modules/tasks/src/Domain/Enums/TaskStatus.php
          rm -rf .batch .patch
          rm -f .github/workflows/apply-batch.yml

      - name: Commit applied batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: close project work management PRD gaps'
          git push origin HEAD:wip/project-work-management-batch-20260816
